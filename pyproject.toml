[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-style-extractor"
version = "0.1.0"
description = "Extract writing style and narrative patterns from book sagas to create a writing bible"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Style Extractor Team"}
]
keywords = ["nlp", "writing", "style-analysis", "narrative", "books"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "nltk>=3.8",
    "spacy>=3.7",
    "textstat>=0.7",
    "rich>=13.0",
    "pydantic>=2.0",
    "click>=8.1",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
]
llm = [
    "anthropic>=0.18",
    "openai>=1.0",
]

[project.scripts]
style-extractor = "style_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
